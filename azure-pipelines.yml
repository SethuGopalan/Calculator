# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Provision
    displayName: Provision EC2
    jobs:
      - job: Terraform
        displayName: Provision EC2 using Terraform
        pool:
         vmImage: ubuntu-latest
        steps:
          - checkout: self
          
        
          - task: TerraformTaskV4@4
            inputs:
              provider: 'aws'
              command: 'init'
              
              backendServiceAWS: 'aws_connect_calculator'
              backendAWSBucketName: 'calculater-app'
              backendAWSKey: 'cal-app'
          - task: TerraformCLI@2
            inputs:
             command: 'validate'
             additionalArguments: '-var "aws_access_key=$(AWS_ACCESS_KEY_ID)" -var "aws_secret_key=$(AWS_SECRET_ACCESS_KEY)"'
             allowTelemetryCollection: true
            env:
             AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
             AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

          - task: TerraformCLI@2
            inputs:
              command: 'plan'
              additionalArguments: '-var "aws_access_key=$(AWS_ACCESS_KEY_ID)" -var "aws_secret_key=$(AWS_SECRET_ACCESS_KEY)"'
              allowTelemetryCollection: true
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                  
          
          - task: TerraformCLI@2
            inputs:
              command: 'apply'
              additionalArguments: '-var "aws_access_key=$(AWS_ACCESS_KEY_ID)" -var "aws_secret_key=$(AWS_SECRET_ACCESS_KEY)"'
              allowTelemetryCollection: true
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                  